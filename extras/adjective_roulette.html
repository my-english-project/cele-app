<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adjective Roulette — CELE UTS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --blue: #004c8f;
      --blue-mid: #00367a;
      --blue-deep: #001a36;
      --green: #00a859;
      --green-dark: #008a48;
      --yellow: #f1c40f;
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at top right, var(--blue), var(--blue-deep));
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Background decoration */
    .bg-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.5;
    }

    .shape1 {
      width: 400px;
      height: 400px;
      background: var(--green);
      top: -100px;
      left: -100px;
    }

    .shape2 {
      width: 500px;
      height: 500px;
      background: var(--blue-mid);
      bottom: -150px;
      right: -150px;
    }

    .header-branding {
      position: absolute;
      top: 30px;
      left: 40px;
      z-index: 10;
    }

    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--green);
      margin-bottom: 5px;
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 900;
      color: #fff;
    }

    .roulette-container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 4rem 3rem;
      width: 90%;
      max-width: 600px;
      text-align: center;
      z-index: 10;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .roulette-container:hover {
      transform: translateY(-5px);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
    }

    .instruction {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      font-weight: 400;
      line-height: 1.5;
    }

    .word-display-wrapper {
      height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 2rem;
      overflow: hidden;
    }

    .adjective-word {
      font-family: 'Playfair Display', serif;
      font-size: 4rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
      line-height: 1;
      margin-bottom: 1rem;
      transition: transform 0.1s, opacity 0.1s;
    }

    .spinning {
      filter: blur(2px);
      opacity: 0.7;
      transform: scale(1.05);
    }

    .type-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 8px 20px;
      border-radius: 30px;
      display: inline-block;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .type-badge.show {
      opacity: 1;
      transform: translateY(0);
    }

    .type-badge.comparative {
      background: rgba(0, 168, 89, 0.2);
      border: 1px solid var(--green);
      color: #4ade80; /* lighter green */
      box-shadow: 0 0 15px rgba(0, 168, 89, 0.4);
    }

    .type-badge.superlative {
      background: rgba(241, 196, 15, 0.15);
      border: 1px solid var(--yellow);
      color: var(--yellow);
      box-shadow: 0 0 15px rgba(241, 196, 15, 0.3);
    }

    .type-badge.equal {
      background: rgba(52, 152, 219, 0.15);
      border: 1px solid #3498db;
      color: #3498db;
      box-shadow: 0 0 15px rgba(52, 152, 219, 0.3);
    }

    .fullscreen-btn {
      position: absolute;
      top: 30px;
      right: 40px;
      z-index: 20;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #fff;
      padding: 8px 12px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fullscreen-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .fullscreen-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .spin-btn {
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 18px 40px;
      font-family: 'Inter', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0, 168, 89, 0.3);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .spin-btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
      transform: skewX(-25deg);
      transition: all 0.5s ease;
    }

    .spin-btn:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 15px 25px rgba(0, 168, 89, 0.4);
    }

    .spin-btn:hover:not(:disabled)::after {
      left: 200%;
    }

    .spin-btn:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: 0 5px 10px rgba(0, 168, 89, 0.3);
    }

    .spin-btn:disabled {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.3);
      box-shadow: none;
      cursor: not-allowed;
    }

    @media(max-width: 600px) {
      .header-branding {
        top: 20px;
        left: 20px;
      }
      .title {
        font-size: 1.4rem;
      }
      .roulette-container {
        padding: 3rem 1.5rem;
      }
      .adjective-word {
        font-size: 3rem;
      }
    }
  </style>
</head>

<body>
  <!-- Background blur shapes -->
  <div class="bg-shape shape1"></div>
  <div class="bg-shape shape2"></div>

  <!-- Header -->
  <div class="header-branding">
    <p class="eyebrow">CELE UTS Practice</p>
    <p class="title">Adjective Roulette</p>
  </div>

  <!-- Fullscreen Button -->
  <button id="fullscreen-btn" class="fullscreen-btn" title="Toggle Fullscreen">
    <svg viewBox="0 0 24 24">
      <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
    </svg>
  </button>

  <!-- Main Card -->
  <div class="roulette-container">
    <p class="instruction">Press the button to get a random adjective. You must create a sentence using the word in the indicated form.</p>
    
    <div class="word-display-wrapper">
      <div id="adjective-display" class="adjective-word">Ready?</div>
      <div id="type-badge" class="type-badge">TYPE</div>
    </div>

    <button id="spin-btn" class="spin-btn">Spin the Wheel</button>
  </div>

  <script>
    // Word bank - hidden from the UI, only accessible in code
    const adjectives = [
      "big", "small", "tall", "short", "happy", "sad", "fast", "slow", 
      "good", "bad", "beautiful", "ugly", "intelligent", "interesting", 
      "expensive", "cheap", "clean", "dirty", "hot", "cold", "dry", "wet", 
      "far", "near", "heavy", "light", "strong", "weak", "young", "old", 
      "rich", "poor", "easy", "difficult", "dangerous", "safe", "busy", 
      "lazy", "early", "late", "important", "popular", "famous", "friendly",
      "funny", "serious", "quiet", "loud"
    ];

    const types = ["Comparative", "Superlative", "Equal"];

    const btn = document.getElementById('spin-btn');
    const wordDisplay = document.getElementById('adjective-display');
    const badgeDisplay = document.getElementById('type-badge');

    // Random utility
    const getRandomItem = (arr) => arr[Math.floor(Math.random() * arr.length)];

    // Sound effects (optional using Web Audio API or just silent if not needed, we'll keep it simple visually)

    btn.addEventListener('click', () => {
      // Disable button during spin
      btn.disabled = true;
      btn.textContent = "Spinning...";
      
      // Hide the badge initially
      badgeDisplay.classList.remove('show', 'comparative', 'superlative');
      
      let spinDuration = 2500; // Total spin time in ms
      let interval = 50; // Initial speed
      let elapsedTime = 0;
      
      // Add spinning blur effect
      wordDisplay.classList.add('spinning');

      // The interval function that swaps words rapidly
      const spinInterval = setInterval(() => {
        wordDisplay.textContent = getRandomItem(adjectives);
        
        elapsedTime += interval;
        
        // Slow down effect
        if (elapsedTime > spinDuration * 0.5) {
          interval += 15; // Gradually increase interval to slow down
        }
        
        // Stop spinning
        if (elapsedTime >= spinDuration) {
          clearInterval(spinInterval);
          finalizeSpin();
        }
      }, interval);

    });

    function finalizeSpin() {
      // Pick final results
      const finalWord = getRandomItem(adjectives);
      const finalType = getRandomItem(types);

      // Remove spinning blur effect
      wordDisplay.classList.remove('spinning');
      
      // Display final results
      wordDisplay.textContent = finalWord;
      
      // Setup badge
      badgeDisplay.textContent = finalType;
      badgeDisplay.className = `type-badge show ${finalType.toLowerCase()}`;
      
      // Reset button
      btn.disabled = false;
      btn.textContent = "Spin Again";
    }

    // Fullscreen functionality
    const fsBtn = document.getElementById('fullscreen-btn');
    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.log(`Error attempting to enable fullscreen: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    });
  </script>
</body>

</html>
