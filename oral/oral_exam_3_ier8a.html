<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oral Exam 3</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Serif+4&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg: #f5f0e8;
      --surface: #fffdf8;
      --ink: #1a1208;
      --accent: #b5451b;
      --accent-light: #e8c4b3;
      --muted: #7a6a52;
      --border: #d6cdb8;
      --fs: 22px;
    }

    body {
      font-family: 'Source Serif 4', serif;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }

    header {
      background: var(--ink);
      color: var(--bg);
      padding: 16px;
      text-align: center;
    }

    .controls {
      background: var(--surface);
      padding: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      border-bottom: 2px solid var(--border);
    }

    .btn {
      background: var(--ink);
      color: white;
      border: none;
      border-radius: 8px;
      width: 44px;
      height: 44px;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .btn:hover {
      background: var(--accent);
    }

    .exam-text {
      font-size: var(--fs);
      line-height: 1.75;
    }

    .word-highlight {
      background: #ffd9c9;
      border-radius: 4px;
      padding: 2px 3px;
    }

    /* 📱 Mobile hint */
    .mobile-hint {
      display: none;
      align-items: center;
      gap: 10px;
      background: #fff4ef;
      border: 1.5px dashed var(--accent-light);
      padding: 12px;
      border-radius: 8px;
      font-size: .85rem;
      margin-bottom: 16px;
    }

    @media(max-width:768px) {
      .mobile-hint {
        display: flex;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Oral Exam 3</h1>
    <p>IER – Group 8A</p>
  </header>

  <div class="controls">
    <select id="studentSelect" onchange="showText()">
      <option value="">— Select a student —</option>
      <option>Emily</option>
      <option>Yael</option>
      <option>Andrés</option>
      <option>Miguel</option>
      <option>Leslie</option>
      <option>Tadeo</option>
      <option>Roberto</option>
      <option>Emiliano</option>
      <option>Leonel</option>
      <option>Rodolfo</option>
      <option>Jovanni</option>
      <option>Gustavo</option>
      <option>Sebastián</option>
      <option>Christian</option>
      <option>Mario</option>
      <option>Miriam</option>
      <option>Carlos</option>
      <option>Álvaro</option>
      <option>Juan de Dios</option>
      <option>María</option>
    </select>

    <button class="btn" onclick="toggleSpeech()">▶</button>
    <button class="btn" onclick="stopSpeech()">■</button>
  </div>

  <main style="padding:24px; display:flex; justify-content:center;">
    <div style="max-width:720px; background:var(--surface); padding:32px; border-radius:10px;" id="card">
      <p>Select a student to start.</p>
    </div>
  </main>

  <script>
    const data = {
      "Emily": { topic: "Smartphones", text: "Smartphones have changed the way people communicate every day." },
      "Yael": { topic: "Smartphones", text: "Smartphones have changed the way people communicate every day." },
      "Andrés": { topic: "The Internet", text: "The internet allows people to learn almost anything from home." },
      "Miguel": { topic: "The Internet", text: "The internet allows people to learn almost anything from home." },
      "Leslie": { topic: "Electric Cars", text: "Electric cars are becoming more popular around the world." },
      "Tadeo": { topic: "Electric Cars", text: "Electric cars are becoming more popular around the world." },
      "Roberto": { topic: "Artificial Intelligence", text: "Artificial intelligence helps computers do tasks." },
      "Emiliano": { topic: "Artificial Intelligence", text: "Artificial intelligence helps computers do tasks." },
      "Leonel": { topic: "Online Shopping", text: "Online shopping has changed the way people buy products." },
      "Rodolfo": { topic: "Online Shopping", text: "Online shopping has changed the way people buy products." },
      "Juan de Dios": { topic: "Renewable Energy", text: "Renewable energy helps create a cleaner future." },
      "María": { topic: "Renewable Energy", text: "Renewable energy helps create a cleaner future." }
    };

    let currentText = "", utterance = null;

    function showText() {
      stopSpeech();
      const name = studentSelect.value;
      if (!data[name]) return;
      currentText = data[name].text;
      card.innerHTML = `
 <div class="mobile-hint">
   📱 <strong>Pronunciation tip:</strong>
   Tap and hold a word, then release to hear it.
 </div>
 <h3>${data[name].topic}</h3>
 <p class="exam-text" id="examText">${currentText}</p>`;
    }

    function toggleSpeech() {
      if (!currentText) return;
      speak(currentText);
    }

    function speak(text) {
      speechSynthesis.cancel();
      utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      speechSynthesis.speak(utterance);
    }

    function stopSpeech() {
      speechSynthesis.cancel();
    }

    document.addEventListener("mouseup", () => {
      const sel = window.getSelection().toString().trim();
      if (sel) {
        speak(sel);
      }
    });
  </script>

</body>

</html>
